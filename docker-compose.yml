name: ibkr-webhook

services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    restart: unless-stopped
    environment:
      TWS_USERID: ${IB_USERID}
      TWS_PASSWORD: ${IB_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: "no"
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      AUTO_RESTART_TIME: "11:59 PM"
      # Without this, IBC waits forever on the "Existing session detected"
      # dialog (e.g. after an unclean restart) instead of taking over, and
      # the Gateway's API port never comes up.
      EXISTING_SESSION_DETECTED_ACTION: primary
    # API ports are only reachable from other containers on this network,
    # never published to the host/internet.
    expose:
      - "4003"
      - "4004"
    networks:
      - ibkr_net

  webhook:
    build: ./app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      IB_HOST: ib-gateway
      IB_PORT: ${IB_PORT:-4004}
      STATE_FILE: /data/positions.json
    volumes:
      - webhook_state:/data
    depends_on:
      - ib-gateway
    expose:
      - "8000"
    networks:
      - ibkr_net
    labels:
      - traefik.enable=true
      - traefik.http.routers.ibkr-webhook.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.ibkr-webhook.entrypoints=websecure
      - traefik.http.routers.ibkr-webhook.tls.certresolver=letsencrypt
      - traefik.http.services.ibkr-webhook.loadbalancer.server.port=8000

networks:
  ibkr_net:

volumes:
  webhook_state:
